# Outline for Paper Tiger. Deployed to /opt/outline on pt-outline.
# Secrets live in /opt/outline/.env (mode 600, never committed).
services:
  outline:
    # Outline 1.12.0 with our collection-tabs patch (outline-image/README.md).
    # Stock image, for rollback: docker.getoutline.com/outlinewiki/outline:1.12.0
    image: ghcr.io/papertiger/outline:1.12.0-pt
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"   # reachable only through Caddy on the host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: outline
      POSTGRES_DB: outline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
